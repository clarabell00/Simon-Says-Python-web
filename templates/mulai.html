<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Color Matcher - Cara Bermain</title>

  <!-- CSS UTAMA -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <!-- 1. VIDEO BACKGROUND KHUSUS CARA BERMAIN -->
  <video autoplay muted loop id="bg-video">
    <source src="{{ url_for('static', filename='media/cara_bermain.mp4') }}" type="video/mp4">
    Browser kamu tidak mendukung video background.
  </video>
  <div class="video-overlay"></div>

  <!-- 2. KONTROL MUSIK MELAYANG -->
  <div class="music-control">
    <button id="music-toggle-btn" class="music-btn" title="Play/Pause Musik">
      <span id="music-icon">🎵</span>
    </button>
    <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.3" title="Atur Volume">
  </div>

  <!-- 3. AUDIO BACKGROUND -->
  <audio id="bg-music" loop preload="auto">
    <source src="{{ url_for('static', filename='media/bg_musik.mp3') }}" type="audio/mpeg">
  </audio>

  <!-- 4. CONTAINER UTAMA CARA BERMAIN -->
  <div class="main-wrapper">
    <div class="title-text">CARA BERMAIN</div>

    <div class="instruction-card">
      <div class="stripe-col">
        <div class="s-red"></div>
        <div class="s-yellow"></div>
        <div class="s-blue"></div>
      </div>
      <div class="card-content">
        INGAT URUTAN WARNA<br><br>TEKAN SESUAI URUTAN
      </div>
      <div class="stripe-col">
        <div class="s-teal"></div>
        <div class="s-green"></div>
        <div class="s-orange"></div>
      </div>
    </div>

    <div class="btn-wrap">
      <a href="{{ url_for('area_game') }}" class="btn-start">MULAI</a>
    </div>

    <div class="score-container">
      <div class="score-card">
        <div class="label">SCORE</div>
        <!-- Diberikan ID val-score agar bisa diisi JS / Jinja2 -->
        <div class="val-box" id="val-score">{{ score if score is defined else 0 }}</div>
      </div>
      <div class="score-card">
        <div class="label">BEST SCORE</div>
        <!-- Diberikan ID val-best-score agar bisa diisi JS / Jinja2 -->
        <div class="val-box" id="val-best-score">{{ best_score if best_score is defined else 0 }}</div>
      </div>
      <div class="score-card">
        <div class="label">RONDE</div>
        <div class="val-box" id="val-ronde">1</div>
      </div>
    </div>
  </div>

  <!-- 5. SCRIPT MUSIK & SKOR -->
  <script>
    const bgMusic = document.getElementById('bg-music');
    const musicBtn = document.getElementById('music-toggle-btn');
    const musicIcon = document.getElementById('music-icon');
    const volumeSlider = document.getElementById('volume-slider');

    // 1. Ambil posisi waktu & status mute musik dari halaman sebelumnya
    const savedTime = localStorage.getItem('musicTime');
    const savedVolume = localStorage.getItem('musicVolume');
    const isMuted = localStorage.getItem('musicMuted');

    if (savedTime) bgMusic.currentTime = parseFloat(savedTime);
    if (savedVolume) {
      bgMusic.volume = parseFloat(savedVolume);
      volumeSlider.value = savedVolume;
    } else {
      bgMusic.volume = volumeSlider.value;
    }

    // 2. Simpan posisi waktu musik secara realtime setiap detiknya
    bgMusic.addEventListener('timeupdate', () => {
      localStorage.setItem('musicTime', bgMusic.currentTime);
    });

    // 3. Fungsi Play Audio
    function playAudio() {
      if (isMuted === 'true') return;
      bgMusic.play().then(() => {
        musicIcon.innerText = '🎵';
      }).catch(err => {
        console.log("Autoplay ditahan browser:", err);
      });
    }

    // Pancing musik agar langsung melanjutkan tanpa jeda
    playAudio();

    // Toggle Play/Pause Button
    musicBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (bgMusic.paused) {
        localStorage.setItem('musicMuted', 'false');
        playAudio();
      } else {
        bgMusic.pause();
        localStorage.setItem('musicMuted', 'true');
        musicIcon.innerText = '🔇';
      }
    });

    // Slider Volume
    volumeSlider.addEventListener('input', (e) => {
      bgMusic.volume = e.target.value;
      localStorage.setItem('musicVolume', e.target.value);
      if (e.target.value == 0) {
        musicIcon.innerText = '🔇';
      } else if (!bgMusic.paused) {
        musicIcon.innerText = '🎵';
      }
    });

    // Pancing audio saat ada interaksi jika tertahan
    const unlockAudio = () => {
      if (bgMusic.paused && localStorage.getItem('musicMuted') !== 'true') {
        playAudio();
      }
      window.removeEventListener('click', unlockAudio);
      window.removeEventListener('keydown', unlockAudio);
    };

    window.addEventListener('click', unlockAudio);
    window.addEventListener('keydown', unlockAudio);

    // 4. PEMBARUAN TAMPILAN SKOR OTOMATIS
    window.addEventListener('DOMContentLoaded', () => {
      // Mengambil nilai skor dari localStorage (mencakup variasi kunci variabel yang umum)
      const savedScore = localStorage.getItem('lastScore') || localStorage.getItem('score') || 0;
      const savedBestScore = localStorage.getItem('bestScore') || localStorage.getItem('best_score') || localStorage.getItem('simon_high_score') || 0;
      
      const scoreEl = document.getElementById('val-score');
      const bestScoreEl = document.getElementById('val-best-score');

      // Update nilai jika variabel dari Flask Jinja2 bernilai 0 atau belum terisi
      if (scoreEl && (scoreEl.innerText.trim() === '0' || scoreEl.innerText.trim() === '')) {
        scoreEl.innerText = savedScore;
      }
      if (bestScoreEl && (bestScoreEl.innerText.trim() === '0' || bestScoreEl.innerText.trim() === '')) {
        bestScoreEl.innerText = savedBestScore;
      }
    });
  </script>

</body>
</html>
